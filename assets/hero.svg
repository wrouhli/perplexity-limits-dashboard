<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" font-family="Satoshi, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Perplexity Limits Dashboard</title>
  <desc id="d">Banner illustration: quota cards, a burn-rate chart with a dashed projection, and a reset countdown.</desc>

  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.08" r="0.95">
      <stop offset="0" stop-color="#4f98a3" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4f98a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f98a3" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4f98a3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="#141312"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <rect x="64" y="58" width="56" height="56" rx="14" fill="#4f98a3"/>
  <path d="M92 72l14 11v16l-14 11-14-11V83z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="92" cy="91" r="5.5" fill="#ffffff"/>

  <text x="138" y="90" font-size="30" font-weight="700" fill="#d0cfcd" letter-spacing="-0.6">Perplexity <tspan fill="#4f98a3">Limits</tspan></text>
  <text x="138" y="120" font-size="16" fill="#7a7977">Quotas, burn rate and reset countdown. No backend.</text>

  <g font-size="13" fill="#7a7977">
    <rect x="64" y="144" width="150" height="32" rx="16" fill="#1a1917" stroke="#353432"/>
    <text x="139" y="165" text-anchor="middle">no build step</text>
    <rect x="226" y="144" width="146" height="32" rx="16" fill="#1a1917" stroke="#353432"/>
    <text x="299" y="165" text-anchor="middle">no npm install</text>
    <rect x="384" y="144" width="164" height="32" rx="16" fill="#1a1917" stroke="#353432"/>
    <text x="466" y="165" text-anchor="middle">installable PWA</text>
  </g>

  <g font-size="15" fill="#7a7977">
    <circle cx="70" cy="226" r="3.5" fill="#4f98a3"/>
    <text x="88" y="231">Works offline once loaded</text>
    <circle cx="70" cy="260" r="3.5" fill="#4f98a3"/>
    <text x="88" y="265">Paste mode needs no credentials</text>
    <circle cx="70" cy="294" r="3.5" fill="#4f98a3"/>
    <text x="88" y="299">Numbers published as static JSON, so no CORS</text>
  </g>

  <text x="64" y="356" font-size="14" fill="#575654">github.com/wrouhli/perplexity-limits-dashboard</text>

  <rect x="616" y="56" width="600" height="288" rx="18" fill="#1a1917" stroke="#353432"/>
  <text x="640" y="86" font-size="12" font-weight="600" fill="#7a7977" letter-spacing="1.4">GLOBAL QUOTAS</text>
  <rect x="1024" y="66" width="168" height="30" rx="15" fill="#2d3b3c"/>
  <text x="1108" y="86" font-size="13" font-weight="700" fill="#4f98a3" text-anchor="middle">resets in 6d 1h</text>

  <g>
    <rect x="640" y="104" width="124" height="62" rx="10" fill="#1f1e1c" stroke="#353432"/>
