    <line x1="640" y1="232" x2="1172" y2="232" stroke="#252422" stroke-dasharray="4 6"/>
    <line x1="640" y1="268" x2="1172" y2="268" stroke="#252422" stroke-dasharray="4 6"/>
    <line x1="640" y1="300" x2="1172" y2="300" stroke="#353432"/>
    <path d="M640 186 C 760 196, 900 210, 1080 236 L1080 300 L640 300 Z" fill="url(#area)"/>
    <path d="M640 186 C 760 196, 900 210, 1080 236" fill="none" stroke="#4f98a3" stroke-width="3" stroke-linecap="round"/>
    <path d="M1080 236 L1172 292" fill="none" stroke="#d47a3e" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
    <g fill="#4f98a3">
      <circle cx="640" cy="186" r="3.5"/>
      <circle cx="760" cy="197" r="3.5"/>
      <circle cx="900" cy="211" r="3.5"/>
      <circle cx="1080" cy="236" r="3.5"/>
