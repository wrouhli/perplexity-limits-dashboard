    <text x="656" y="151" font-size="11" fill="#7a7977">Pro queries · 32%</text>
    <circle cx="742" cy="118" r="4" fill="#6daa45"/>

    <rect x="776" y="104" width="124" height="62" rx="10" fill="#1f1e1c" stroke="#353432"/>
    <text x="792" y="132" font-size="20" font-weight="700" fill="#d0cfcd">44</text>
    <text x="792" y="151" font-size="11" fill="#7a7977">Research · 44%</text>
    <circle cx="878" cy="118" r="4" fill="#6daa45"/>

    <rect x="912" y="104" width="124" height="62" rx="10" fill="#1f1e1c" stroke="#353432"/>
    <text x="928" y="132" font-size="20" font-weight="700" fill="#d0cfcd">1</text>
    <text x="928" y="151" font-size="11" fill="#7a7977">Labs · 7%</text>
    <circle cx="1014" cy="118" r="4" fill="#d47a3e"/>

    <rect x="1048" y="104" width="124" height="62" rx="10" fill="#1f1e1c" stroke="#353432"/>
    <text x="1064" y="132" font-size="20" font-weight="700" fill="#d163a7">0</text>
    <text x="1064" y="151" font-size="11" fill="#7a7977">Agentic · depleted</text>
