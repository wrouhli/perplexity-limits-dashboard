name: refresh data

# Scrapes the current limits and commits them as static JSON.
#
# On demand only: there is no scheduled trigger, on purpose. The published page
# ships the demo dataset, so an unattended run every two hours had nothing to
# fetch and only produced a Pages deployment, plus the occasional transient
# deploy-pages failure. Run it from the Actions tab when you want a snapshot.
#
# Needs one repository secret: PERPLEXITY_COOKIE, holding the Cookie header
# your browser sends to perplexity.ai (or just the session token value).
# Without it the job skips cleanly, so the page can ship before the secret
# exists. See the README for how to obtain and rotate it.
#
# The deployment is retried once: actions/deploy-pages occasionally fails to
# find the artifact it just uploaded ("Fetching artifact metadata failed") and
# succeeds on a second attempt.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Same group as deploy.yml: two Pages deployments must never overlap,
  # otherwise one of them loses the race for the github-pages artifact.
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Is the cookie configured?
        id: cfg
        env:
          COOKIE: ${{ secrets.PERPLEXITY_COOKIE }}
        run: |
          if [ -n "$COOKIE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Refresh skipped::PERPLEXITY_COOKIE is not set. Add it under Settings → Secrets and variables → Actions."
          fi

      - name: Fetch limits
        if: steps.cfg.outputs.configured == 'true'
        env:
          PERPLEXITY_COOKIE: ${{ secrets.PERPLEXITY_COOKIE }}
        run: python3 scripts/fetch_limits.py

      - name: Commit if the snapshot changed
        if: steps.cfg.outputs.configured == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh limits snapshot"
            git push
          fi

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js lib.js sw.js icon.svg manifest.webmanifest _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Let the artifact register before retrying
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fail only if both attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "::error::Pages deployment failed twice, see the artifact-metadata error above. Re-run this job."
          exit 1
