name: deploy

# Publishes the site on every push to main.
#
# Note: the refresh workflow deploys as well, even though that looks
# redundant. Commits pushed with the default GITHUB_TOKEN do not trigger
# other workflows, so a refresh commit would never reach Pages if this
# were the only deployer.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js lib.js sw.js icon.svg manifest.webmanifest _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
